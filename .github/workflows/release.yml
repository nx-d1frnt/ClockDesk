name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g., v2.0.0-rc2)'
        required: false
        default: ''
      draft:
        description: 'Create draft release'
        type: boolean
        required: false
        default: false
      prerelease:
        description: 'Mark as pre-release (auto-detected if tag has -rc, -beta, -alpha)'
        type: boolean
        required: false
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Tag and Pre-release Status
        id: release_info
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event.inputs.prerelease }}" = "true" ] || echo "$TAG" | grep -Eq '-(alpha|beta|rc)'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore Keystore from Secret
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding signing keystore..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/signing-keystore.jks
            echo "KEYSTORE_FILE=signing-keystore.jks" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_BASE64 secret not found; falling back to debug signing."
          fi

      - name: Build Release APKs
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Cleanup Keystore
        if: always()
        run: rm -f app/signing-keystore.jks

      - name: Collect Assets & Generate Checksums
        id: assets
        run: |
          mkdir -p release-assets
          find app/build/outputs/apk/release -type f -name "*.apk" -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum *.apk > sha256sums.txt
          echo "CHECKSUMS<<EOF" >> "$GITHUB_ENV"
          cat sha256sums.txt >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "ClockDesk ${{ steps.release_info.outputs.tag }}"
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ steps.release_info.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ### 📦 ClockDesk ${{ steps.release_info.outputs.tag }}

            Download the APK for your device architecture, or choose the **universal** APK.

            #### 🔐 SHA-256 Checksums
            ```text
            ${{ env.CHECKSUMS }}
            ```
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
