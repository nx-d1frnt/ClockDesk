name: Nightly Build

on:
  schedule:
    # 02:00 UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (leave empty to use NIGHTLY_BRANCH / default branch)'
        required: false
        default: ''

concurrency:
  group: nightly-build
  cancel-in-progress: true

env:
  TARGET_BRANCH: ${{ github.event.inputs.branch || vars.NIGHTLY_BRANCH || github.event.repository.default_branch || 'master' }}

jobs:
  check_commits:
    name: Check for New Commits
    runs-on: ubuntu-latest
    outputs:
      has_new_commits: ${{ steps.check.outputs.has_new_commits }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Check if commits occurred in last 24h
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger; proceeding with build."
            echo "has_new_commits=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SINCE=$(date --date="24 hours ago" --iso-8601=seconds)
          COMMITS=$(git log --since="$SINCE" --oneline)
          if [ -n "$COMMITS" ]; then
            echo "New commits detected in the last 24 hours on $TARGET_BRANCH."
            echo "has_new_commits=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new commits in the last 24 hours on $TARGET_BRANCH. Skipping build."
            echo "has_new_commits=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build & Publish Nightly
    needs: check_commits
    if: needs.check_commits.outputs.has_new_commits == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore Keystore from Secret
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding signing keystore..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/signing-keystore.jks
            echo "KEYSTORE_FILE=signing-keystore.jks" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_BASE64 secret not found; falling back to debug signing."
          fi

      - name: Build Nightly APKs
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GITHUB_SHA: ""
        run: ./gradlew assembleNightly --no-daemon

      - name: Cleanup Keystore
        if: always()
        run: rm -f app/signing-keystore.jks

      - name: Collect Assets & Generate Checksums
        id: assets
        run: |
          mkdir -p release-assets
          find app/build/outputs/apk/nightly -type f -name "*.apk" -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum *.apk > sha256sums.txt
          echo "BUILD_DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Generate Changelog from Commits
        id: changelog
        run: |
          REPO_URL="https://github.com/${{ github.repository }}"
          HEAD_SHA=$(git rev-parse HEAD)

          # Force-fetch the remote nightly tag so we compare against the actual previous build
          git fetch origin +refs/tags/nightly:refs/tags/nightly --no-tags 2>/dev/null || true
          PREV_TAG=$(git rev-parse refs/tags/nightly^{commit} 2>/dev/null || echo "")

          # Only use PREV_TAG if it exists, is distinct from HEAD, and is an ancestor of HEAD
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$HEAD_SHA" ] && git merge-base --is-ancestor "$PREV_TAG" HEAD 2>/dev/null; then
            RANGE="$PREV_TAG..HEAD"
            COMPARE_LINK="**Full Changes**: $REPO_URL/compare/$PREV_TAG...$HEAD_SHA"
          else
            SINCE=$(date --date="24 hours ago" --iso-8601=seconds)
            RANGE="--since=$SINCE"
            COMPARE_LINK=""
          fi

          FORMAT="- %s ([%h]($REPO_URL/commit/%H))"

          FEATS=$(git log $RANGE --no-merges --grep="^feat" --pretty=format:"$FORMAT")
          FIXES=$(git log $RANGE --no-merges --grep="^fix" --pretty=format:"$FORMAT")
          UI_PERF=$(git log $RANGE --no-merges --grep="^\(ui\|perf\|refactor\)" --pretty=format:"$FORMAT")
          MAINT=$(git log $RANGE --no-merges --grep="^\(chore\|docs\|ci\|build\|style\|test\)" --pretty=format:"$FORMAT")
          OTHER=$(git log $RANGE --no-merges --grep="^\(feat\|fix\|ui\|perf\|refactor\|chore\|docs\|ci\|build\|style\|test\)" --invert-grep --pretty=format:"$FORMAT")

          {
            echo "### 🌙 ClockDesk Nightly Build"
            echo ""
            echo "- **Branch:** [\`${{ env.TARGET_BRANCH }}\`]($REPO_URL/tree/${{ env.TARGET_BRANCH }})"
            echo "- **Commit:** [\`${{ env.SHORT_SHA }}\`]($REPO_URL/commit/${{ env.SHORT_SHA }})"
            echo "- **Date:** ${{ env.BUILD_DATE }}"
            echo ""
            echo "> [!WARNING]"
            echo "> Nightly builds are automated snapshots created directly from active development branches. They may contain experimental features, bugs, or incomplete functionality."
            echo ""
            echo "### What's Changed"
            echo "<!-- changelog-start -->"
            HAS_CHANGES=false
            if [ -n "$FEATS" ]; then
              echo ""
              echo "#### Features"
              echo "$FEATS"
              HAS_CHANGES=true
            fi
            if [ -n "$FIXES" ]; then
              echo ""
              echo "#### Bug Fixes"
              echo "$FIXES"
              HAS_CHANGES=true
            fi
            if [ -n "$UI_PERF" ]; then
              echo ""
              echo "#### UI & Performance"
              echo "$UI_PERF"
              HAS_CHANGES=true
            fi
            if [ -n "$MAINT" ]; then
              echo ""
              echo "#### Maintenance & Chores"
              echo "$MAINT"
              HAS_CHANGES=true
            fi
            if [ -n "$OTHER" ]; then
              echo ""
              echo "#### Other Changes"
              echo "$OTHER"
              HAS_CHANGES=true
            fi
            if [ "$HAS_CHANGES" = "false" ]; then
              echo "- Routine maintenance and stability build."
            fi
            echo "<!-- changelog-end -->"
            if [ -n "$COMPARE_LINK" ]; then
              echo ""
              echo "$COMPARE_LINK"
            fi
            echo ""
            echo "#### 📦 Downloads"
            echo "Download the APK for your device architecture, or use the **universal** APK."
            echo ""
            echo "**SHA-256 Checksums:**"
            echo '```text'
            cat release-assets/sha256sums.txt
            echo '```'
          } > nightly_description.md

      - name: Recreate Nightly Release at Top
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Removing previous nightly release and tag to ensure current chronological ordering..."
          gh release delete nightly --yes --cleanup-tag || true

      - name: Publish Rolling Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ env.TARGET_BRANCH }}
          name: "Nightly Build (${{ env.BUILD_DATE }} - ${{ env.TARGET_BRANCH }} - ${{ env.SHORT_SHA }})"
          body_path: nightly_description.md
          prerelease: true
          make_latest: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
